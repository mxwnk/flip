name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than macos-latest: the runner image decides the Swift version,
    # and a silent bump is not something a release pipeline should discover on its
    # own. Flip deploys to macOS 14, so the SDK here is newer than the target.
    runs-on: macos-15

    permissions:
      contents: write # only used by the release step

    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble the bundle
        run: make bundle

      # Everything below only runs for a v* tag.

      - name: Import the signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12" || { echo "SIGNING_CERTIFICATE_P12 is not set"; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/signing.p12"
          PEM="$RUNNER_TEMP/signing.pem"

          echo "$CERTIFICATE_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: the default timeout can expire mid-build.
          security set-keychain-settings -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # codesign searches the user's keychain list, so the new one has to join
          # it rather than merely exist.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # A self-signed certificate is not a valid signing identity until it is
          # trusted; without this codesign reports CSSMERR_TP_NOT_TRUSTED. The
          # runner is thrown away afterwards, so trusting it system-wide is fine.
          /usr/bin/openssl pkcs12 -in "$P12" -clcerts -nokeys \
            -passin "pass:$CERTIFICATE_PASSWORD" -out "$PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$PEM"

          rm -f "$P12" "$PEM"
          security find-identity -v -p codesigning

      - name: Assert the designated requirement has not drifted
        if: startsWith(github.ref, 'refs/tags/v')
        # Runs before packaging, so a release that would revoke everyone's
        # Accessibility and Screen Recording grants never gets built at all.
        run: make verify VERSION="${GITHUB_REF_NAME#v}"

      - name: Package the disk image
        if: startsWith(github.ref, 'refs/tags/v')
        run: make dmg VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$RUNNER_TEMP/notes.md"

          # The readable half comes out of CHANGELOG.md, so release notes are
          # written and reviewed alongside the change rather than assembled from
          # commit subjects afterwards.
          awk -v heading="## $VERSION" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES"

          if [ ! -s "$NOTES" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            echo "See the commit history for what changed." > "$NOTES"
          fi

          cat >> "$NOTES" <<'TRAILER'

          ---

          ### Installing

          ```sh
          brew install --cask mxwnk/flip/flip
          ```

          Or take the disk image below. Flip is signed with its own certificate
          rather than notarised, so a copy installed by hand has to be allowed once
          under System Settings › Privacy & Security. Homebrew does that for you.

          Accessibility is asked for on first run, Screen Recording only if you
          want thumbnails. Both survive updates: the signature is pinned to the same
          certificate every release, and the pipeline refuses to publish one where
          it has drifted.
          TRAILER

          # Leading indentation is what keeps this readable in the workflow file;
          # GitHub would render it as code blocks.
          sed -i '' 's/^          //' "$NOTES"

          gh release create "$GITHUB_REF_NAME" \
            --title "Flip $VERSION" \
            --notes-file "$NOTES" \
            "build/Flip-$VERSION.dmg"

      - name: Point the Homebrew tap at the new version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # A release is still a release without the tap bump, so a missing key
          # warns rather than fails. The cask simply keeps pointing at the
          # previous version until someone updates it.
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set — the cask still points at the previous version"
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "build/Flip-$VERSION.dmg" | cut -d ' ' -f 1)"

          # A deploy key rather than a personal token: it can write to the tap and
          # to nothing else, so a leaked runner cannot reach the rest of the account.
          KEY="$RUNNER_TEMP/tap-deploy-key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:mxwnk/homebrew-flip.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"

          # Anchored to the start of the line so nothing in the comments or the
          # url can match. Both substitutions must land, hence the count check.
          /usr/bin/sed -i '' \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$SHA\"|" \
            Casks/flip.rb
          grep -qx "  version \"$VERSION\"" Casks/flip.rb
          grep -qx "  sha256 \"$SHA\"" Casks/flip.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flip.rb
          git diff --cached --quiet && { echo "Cask already at $VERSION"; exit 0; }
          git commit -m "chore: update flip to $VERSION"
          git push

      - name: Keep the unsigned bundle for inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: Flip-unsigned
          path: build/Flip.app
          retention-days: 7
